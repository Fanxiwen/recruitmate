services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: recruitmate-postgres
    environment:
      POSTGRES_USER: recruitmate
      POSTGRES_PASSWORD: recruitmate
      POSTGRES_DB: recruitmate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitmate"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: recruitmate-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: recruitmate-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ./apps/api
    container_name: recruitmate-api
    environment:
      APP_ENV: docker
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://recruitmate:recruitmate@postgres:5432/recruitmate?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: change-me-in-production
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: resumes
      S3_USE_SSL: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:
  miniodata:
